<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencari Kiblat</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #eef3f8;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 20px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.13);
    }

    h1 {
      text-align: center;
      color: #222;
      margin-top: 0;
    }

    .compass {
      width: 300px;
      height: 300px;
      margin: 20px auto;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle, #ffffff 58%, #ececec 59%, #d9d9d9 100%);
      border: 10px solid white;
      box-shadow: 0 0 25px rgba(0,0,0,0.2);
    }

    .dial {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      will-change: transform;
    }

    .tick {
      position: absolute;
      left: 50%;
      top: 5px;
      transform-origin: center 145px;
      z-index: 1;
    }

    .label {
      position: absolute;
      font-size: 11px;
      font-weight: bold;
      color: #444;
      z-index: 2;
    }

    .cardinal {
      position: absolute;
      font-size: 22px;
      font-weight: bold;
      z-index: 15;
    }

    .north {
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: #e53935;
    }

    .east {
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #333;
    }

    .south {
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: #333;
    }

    .west {
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #333;
    }

    /* Jarum Petunjuk */
    .needle {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      pointer-events: none;
    }

    .red {
      position: absolute;
      width: 12px;
      height: 120px;
      left: -6px;
      top: -120px;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      background: linear-gradient(to top, #b71c1c, #ff5252);
    }

    .blue {
      position: absolute;
      width: 12px;
      height: 120px;
      left: -6px;
      top: 0;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      background: linear-gradient(to bottom, #0d47a1, #42a5f5);
    }

    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 20px;
      margin: -10px;
      border-radius: 50%;
      z-index: 30;
      background: radial-gradient(circle, #fff, #444);
      border: 3px solid white;
      box-shadow: 0 0 8px rgba(0,0,0,0.3);
    }

    /* Marker Ka'bah */
    .qibla-marker {
      position: absolute;
      left: 50%;
      top: 50%;
      font-size: 32px;
      z-index: 10;
      filter: drop-shadow(0 0 6px rgba(0,0,0,0.3));
    }

    .status {
      transition: 0.4s;
      padding: 15px;
      border-radius: 30px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      margin-top: 15px;
      background: #ffe0b2;
      color: #e65100;
    }

    .status.ok {
      background: #2ecc71;
      color: white;
      box-shadow: 0 0 20px rgba(46,204,113,0.6);
    }

    .info {
      margin-top: 20px;
      font-size: 16px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
    }

    .value {
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 15px;
      background: #1976d2;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      background: #1565c0;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Pencari Kiblat</h1>

  <div class="compass">
    <div id="dial" class="dial">
      <!-- Garis, angka, dan huruf arah angin akan di-generate via JavaScript -->
      <div class="cardinal north">U</div>
      <div class="cardinal east">T</div>
      <div class="cardinal south">S</div>
      <div class="cardinal west">B</div>
    </div>

    <div id="qiblaMarker" class="qibla-marker">🕋</div>

    <div class="needle">
      <div class="red"></div>
      <div class="blue"></div>
    </div>

    <div class="center"></div>
  </div>

  <div id="status" class="status">
    Tekan tombol di bawah
  </div>

  <div class="info">
    <div class="item">
      <span>Latitude</span>
      <span id="lat" class="value">-</span>
    </div>
    <div class="item">
      <span>Longitude</span>
      <span id="lng" class="value">-</span>
    </div>
    <div class="item">
      <span>Heading HP</span>
      <span id="heading" class="value">0°</span>
    </div>
    <div class="item">
      <span>Arah Kiblat</span>
      <span id="bearing" class="value">-</span>
    </div>
  </div>

  <button id="btnStart" onclick="initApp()">
    Aktifkan Lokasi & Kompas
  </button>
</div>

<script>
  const kaabaLat = 21.422487;
  const kaabaLng = 39.826206;

  let qibla = 0;
  let targetHeading = 0;
  let smoothHeading = 0;
  let animationStarted = false;
  let firstHeading = true;
  let sensorStarted = false;

  // 1. Inisialisasi Ticks & Angka pada Dial
  function createTicks() {
    const dial = document.getElementById("dial");

    for (let i = 0; i < 360; i += 5) {
      const tick = document.createElement("div");
      tick.className = "tick";
      if (i % 30 === 0) {
        tick.style.height = "24px";
        tick.style.width = "2px";
        tick.style.background = "#333";
      } else {
        tick.style.height = "12px";
        tick.style.width = "1px";
        tick.style.background = "#999";
      }
      tick.style.transform = `translateX(-50%) rotate(${i}deg)`;
      dial.appendChild(tick);
    }

    for (let i = 0; i < 360; i += 30) {
      const label = document.createElement("div");
      label.className = "label";
      label.innerHTML = i + "°";
      label.dataset.rot = i;
      label.style.left = "50%";
      label.style.top = "50%";
      label.style.transform = `translate(-50%, -50%) rotate(${i}deg) translateY(-120px) rotate(${-i}deg)`;
      dial.appendChild(label);
    }
  }
  createTicks();

  // Helper matematika
  const rad = (x) => (x * Math.PI) / 180;
  const deg = (x) => (x * 180) / Math.PI;

  // 2. Hitung Arah Kiblat (Great Circle Distance Formula)
  function qiblaBearing(lat, lng) {
    let phi1 = rad(lat);
    let phi2 = rad(kaabaLat);
    let dlambda = rad(kaabaLng - lng);

    let y = Math.sin(dlambda);
    let x = Math.cos(phi1) * Math.tan(phi2) - Math.sin(phi1) * Math.cos(dlambda);

    return (deg(Math.atan2(y, x)) + 360) % 360;
  }

  // 3. Render Pembaruan Tampilan Kompas
  function updateCompass() {
    // Putar dial kompas
    document.getElementById("dial").style.transform = `rotate(${-smoothHeading}deg)`;

    // Jaga agar label derajat tetap tegak
    document.querySelectorAll(".label").forEach((label) => {
      const rot = Number(label.dataset.rot);
      label.style.transform = `translate(-50%, -50%) rotate(${rot}deg) translateY(-120px) rotate(${smoothHeading - rot}deg)`;
    });

    // Posisi Ka'bah relatif terhadap arah perangkat
    let angle = (qibla - smoothHeading + 360) % 360;
    const radius = 120;
    const x = Math.sin(rad(angle)) * radius;
    const y = -Math.cos(rad(angle)) * radius;

    const marker = document.getElementById("qiblaMarker");
    marker.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px) rotate(${-angle}deg)`;

    checkQibla(angle);
  }

  // 4. Cek Akurasi Posisi Kebulatan Arah
  function checkQibla(angle) {
    const diff = ((angle + 540) % 360) - 180;
    const status = document.getElementById("status");
    const compass = document.querySelector(".compass");

    if (Math.abs(diff) <= 3) {
      status.className = "status ok";
      status.innerHTML = "✅ Sudah Menghadap Kiblat";
      compass.style.boxShadow = "0 0 35px rgba(46,204,113,0.8)";
    } else {
      status.className = "status";
      status.innerHTML = "↻ Putar " + Math.abs(diff).toFixed(1) + "°";
      compass.style.boxShadow = "0 0 25px rgba(0,0,0,0.2)";
    }
  }

  // 5. Loop Animasi Pergerakan Kompas
  function animateCompass() {
    let diff = ((targetHeading - smoothHeading + 540) % 360) - 180;
    smoothHeading += diff * 0.15;
    smoothHeading = ((smoothHeading % 360) + 360) % 360;

    updateCompass();
    requestAnimationFrame(animateCompass);
  }

  // 6. Handler Sensor Perangkat
  function orientationHandler(e) {
    let heading = null;

    if (typeof e.webkitCompassHeading === "number") {
      // iOS Safari
      heading = e.webkitCompassHeading;
    } else if (e.alpha !== null) {
      // Android
      heading = 360 - e.alpha;
    }

    if (heading !== null) {
      heading = ((heading % 360) + 360) % 360;

      if (firstHeading) {
        targetHeading = heading;
        smoothHeading = heading;
        firstHeading = false;
      }

      let diff = ((heading - targetHeading + 540) % 360) - 180;
      targetHeading += diff * 0.4;
      targetHeading = ((targetHeading % 360) + 360) % 360;

      document.getElementById("heading").innerHTML = targetHeading.toFixed(1) + "°";
    }
  }

  // 7. Ambil Lokasi GPS
  function getLocation() {
    if (!navigator.geolocation) {
      alert("Browser Anda tidak mendukung lokasi.");
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        let lat = pos.coords.latitude;
        let lng = pos.coords.longitude;

        document.getElementById("lat").innerHTML = lat.toFixed(6);
        document.getElementById("lng").innerHTML = lng.toFixed(6);

        qibla = qiblaBearing(lat, lng);
        document.getElementById("bearing").innerHTML = qibla.toFixed(2) + "°";
      },
      (err) => {
        alert("Gagal mengambil lokasi: " + err.message + "\nPastikan GPS dan izin lokasi aktif.");
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  // 8. Fungsi Utama (Dipanggil Saat Klik Tombol)
  function initApp() {
    // Jalankan Geolocation
    getLocation();

    // Minta Izin Sensor Orientasi (Khusus iOS 13+)
    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {
      DeviceOrientationEvent.requestPermission()
        .then((permission) => {
          if (permission === "granted") {
            startCompassListener();
          } else {
            alert("Izin kompas ditolak.");
          }
        })
        .catch(console.error);
    } else {
      startCompassListener();
    }
  }

  function startCompassListener() {
    if (sensorStarted) return;

    if ("ondeviceorientationabsolute" in window) {
      window.addEventListener("deviceorientationabsolute", orientationHandler, true);
    } else if ("ondeviceorientation" in window) {
      window.addEventListener("deviceorientation", orientationHandler, true);
    } else {
      alert("Perangkat Anda tidak mendukung sensor kompas.");
    }

    sensorStarted = true;

    if (!animationStarted) {
      animationStarted = true;
      animateCompass();
    }
  }
</script>

</body>
</html>
