<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Pencari Kiblat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#eef3f8;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

}

.card{

width:100%;

max-width:420px;

background:white;

border-radius:20px;

padding:20px;

box-shadow:0 10px 25px rgba(0,0,0,.12);

}

h1{

text-align:center;

margin-bottom:20px;

color:#222;

}

.compass{

<div class="compass">

    <div id="dial" class="dial">

        <div class="ticks"></div>

        <div class="north">U</div>
        <div class="east">T</div>
        <div class="south">S</div>
        <div class="west">B</div>

        <div id="qiblaMarker" class="qibla-marker">
            🕋
        </div>

    </div>

    <div class="needle">
        <div class="needle-red"></div>
        <div class="needle-blue"></div>
    </div>

    <div id="centerDot" class="center"></div>

</div>

<div id="status" class="status">
    Arahkan ke Kiblat
</div>

}

.center{

position:absolute;

left:50%;

top:50%;

width:18px;

height:18px;

margin-left:-9px;

margin-top:-9px;

background:#333;

border-radius:50%;

z-index:100;

}

.needle{

position:absolute;

left:50%;

top:50%;

width:0;

height:0;

z-index:50;

}

.needle-red{

position:absolute;

width:12px;

height:110px;

left:-6px;

top:-110px;

background:#e53935;

clip-path:polygon(50% 0%,100% 100%,0% 100%);

border-radius:10px;

}

.needle-blue{

position:absolute;

width:12px;

height:110px;

left:-6px;

top:0;

background:#1565c0;

clip-path:polygon(0% 0%,100% 0%,50% 100%);

border-radius:10px;

}
    
.info{

margin-top:25px;

font-size:18px;

}

.item{

display:flex;

justify-content:space-between;

margin-top:15px;

}

.value{

font-weight:bold;

}

button{

width:100%;

margin-top:25px;

padding:14px;

border:none;

background:#1976d2;

color:white;

font-size:18px;

border-radius:12px;

cursor:pointer;

}

.dial{

position:absolute;
left:0;
top:0;
width:100%;
height:100%;
border-radius:50%;
transition:none;

}

.north,
.east,
.south,
.west{

position:absolute;
font-weight:bold;
font-size:24px;

}

.north{

left:50%;
top:10px;
transform:translateX(-50%);
color:red;

}

.east{

right:15px;
top:50%;
transform:translateY(-50%);

}

.south{

left:50%;
bottom:10px;
transform:translateX(-50%);

}

.west{

left:15px;
top:50%;
transform:translateY(-50%);

}

.qibla-marker{

position:absolute;

left:50%;

top:50%;

font-size:34px;

transform-origin:center center;

}

    .status{

margin-top:20px;

padding:14px;

border-radius:30px;

text-align:center;

font-size:18px;

font-weight:bold;

background:#eeeeee;

transition:.3s;

}

.status.ok{

background:#d7ffd9;

color:#0a8a2a;

border:2px solid #00c853;

}

.status.wait{

background:#ffe0b2;

color:#ef6c00;

}

</style>

</head>

<body>

<div class="card">

<h1>Pencari Kiblat</h1>

<div class="compass">

    <div id="dial" class="dial">

        <div class="north">U</div>

        <div class="east">T</div>

        <div class="south">S</div>

        <div class="west">B</div>

    </div>

    <div id="qiblaMarker" class="qibla-marker">
        🕋
    </div>

    <div class="center"></div>

</div>

<div class="info">

<div class="item">

<span>Latitude</span>

<span id="lat" class="value">-</span>

</div>

<div class="item">

<span>Longitude</span>

<span id="lng" class="value">-</span>

</div>

<div class="item">
    
<span>Heading</span>
    
<span id="heading" class="value">0°</span>
    
</div>

<div class="item">

<span>Arah Kiblat</span>

<span id="bearing" class="value">-</span>

</div>

</div>

<button onclick="getLocation()">

Ambil Lokasi

</button>

</div>

<script>

const kaabaLat=21.422487;

const kaabaLng=39.826206;
    
let qibla = 0;

let targetHeading = 0;
    
let smoothHeading = 0;

let animationStarted = false;

const DEAD_ZONE = 0.5;

function rad(x){

return x*Math.PI/180;

}

function deg(x){

return x*180/Math.PI;

}

function qiblaBearing(lat,lng){

let phi1=rad(lat);

let phi2=rad(kaabaLat);

let dlambda=rad(kaabaLng-lng);

let y=Math.sin(dlambda);

let x=Math.cos(phi1)*Math.tan(phi2)-Math.sin(phi1)*Math.cos(dlambda);

let brng=deg(Math.atan2(y,x));

return (brng+360)%360;

}

function updateCompass(){

document.getElementById("dial").style.transform=
`rotate(${-smoothHeading}deg)`;

let angle=qibla-smoothHeading;

document.getElementById("qiblaMarker").style.transform=
`translate(-50%,-50%)
rotate(${angle}deg)
translateY(-125px)
rotate(${-angle}deg)`;

updateStatus(angle);
document.querySelector(".north").style.transform=
`translateX(-50%) rotate(${smoothHeading}deg)`;

document.querySelector(".east").style.transform=
`translateY(-50%) rotate(${smoothHeading}deg)`;

document.querySelector(".south").style.transform=
`translateX(-50%) rotate(${smoothHeading}deg)`;

document.querySelector(".west").style.transform=
`translateY(-50%) rotate(${smoothHeading}deg)`;

}

function updateStatus(angle){

let diff=((angle+540)%360)-180;

let status=document.getElementById("status");

if(Math.abs(diff)<=3){

status.className="status ok";

status.innerHTML="✅ Sudah Menghadap Kiblat";

}else{

status.className="status wait";

status.innerHTML="↻ Putar " + Math.abs(diff).toFixed(1)+"°";

}

}
    
function success(pos){

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    document.getElementById("lat").innerHTML = lat.toFixed(6);
    document.getElementById("lng").innerHTML = lng.toFixed(6);

    qibla = qiblaBearing(lat,lng);

    document.getElementById("bearing").innerHTML =
        qibla.toFixed(2)+"°";
    startCompass();

}

function error(){

alert("Lokasi tidak tersedia");

}

function orientationHandler(event){

    let newHeading = null;

    // Safari / iPhone
    if(typeof event.webkitCompassHeading === "number"){

        newHeading = event.webkitCompassHeading;

    }
    // Android
    else if(event.alpha !== null){

        newHeading = 360 - event.alpha;

    }

    if(newHeading === null) return;

    newHeading = (newHeading + 360) % 360;

    targetHeading = newHeading;

document.getElementById("heading").innerHTML =
    targetHeading.toFixed(1) + "°";
}

function shortestAngle(current,target){

    let diff = target-current;

    diff = ((diff+540)%360)-180;

    return diff;

}

function animateCompass(){

    let diff = shortestAngle(
        smoothHeading,
        targetHeading
    );

    if(Math.abs(diff)>DEAD_ZONE){

        let alpha;

        if(Math.abs(diff)>60){

    alpha=0.28;

}else if(Math.abs(diff)>25){

    alpha=0.18;

}else if(Math.abs(diff)>10){

    alpha=0.12;

}else{

    alpha=0.05;

}

        smoothHeading += diff*alpha;

        smoothHeading =
        (smoothHeading+360)%360;

    }

    updateCompass();

    requestAnimationFrame(
        animateCompass
    );

}

function getLocation(){

    navigator.geolocation.getCurrentPosition(
        success,
        error,
        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }
    );

}
    
function startCompass(){

    if(typeof DeviceOrientationEvent !== "undefined" &&
       typeof DeviceOrientationEvent.requestPermission === "function"){

        // iPhone / iPad
        DeviceOrientationEvent.requestPermission()
        .then(permission=>{

            if(permission==="granted"){

                window.addEventListener(
                    "deviceorientation",
                    orientationHandler,
                    true
                );

                if(!animationStarted){
                    animationStarted=true;
                    animateCompass();
                }

            }

        });

    }else{

        // Android

        if ("ondeviceorientationabsolute" in window) {

    window.addEventListener(
        "deviceorientationabsolute",
        orientationHandler,
        true
    );

} else {

    window.addEventListener(
        "deviceorientation",
        orientationHandler,
        true
    );

}

        if(!animationStarted){
            animationStarted=true;
            animateCompass();
        }

    }

}
  

</script>

</body>
</html>
