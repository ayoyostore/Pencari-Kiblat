<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencari Kiblat</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f7f9;
      padding: 15px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 24px 20px;
      border-radius: 32px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
    }

    h1 {
      text-align: center;
      color: #000;
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 10px 0;
    }

    /* Outer Ring Compass */
    .compass-container {
      width: 320px;
      height: 320px;
      margin: 10px auto;
      position: relative;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12), inset 0 0 3px rgba(0,0,0,0.05);
      border: 8px solid #fcfcfc;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dial {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      will-change: transform;
    }

    /* Ticks Marks */
    .tick {
      position: absolute;
      left: 50%;
      top: 12px;
      transform-origin: center 148px;
      z-index: 1;
    }

    .tick-major {
      height: 8px;
      width: 1.5px;
      background: #333;
    }

    .tick-minor {
      height: 5px;
      width: 1px;
      background: #aaa;
    }

    /* Labels */
    .degree-label {
      position: absolute;
      font-size: 11px;
      font-weight: 600;
      color: #555;
      z-index: 2;
    }

    .cardinal {
      position: absolute;
      font-weight: 800;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
      text-align: center;
    }

    .cardinal-letter {
      font-size: 22px;
    }

    .cardinal-deg {
      font-size: 9px;
      color: #555;
      margin-top: 2px;
      font-weight: 600;
    }

    .north {
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: #d32f2f;
    }

    .east {
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      color: #111;
    }

    .south {
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: #111;
    }

    .west {
      left: 22px;
      top: 50%;
      transform: translateY(-50%);
      color: #111;
    }

    /* Compass Needle */
    .needle {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 20;
      pointer-events: none;
    }

    .needle-north {
      position: absolute;
      left: 50%;
      bottom: 50%;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 95px solid #e53935;
      transform: translateX(-50%);
    }

    .needle-south {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 95px solid #1e88e5;
      transform: translateX(-50%);
    }

    .center-cap {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 25;
      background: radial-gradient(circle, #f0f0f0 30%, #b0b0b0 100%);
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* Kaaba Marker Glow */
    .qibla-marker {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 15;
      pointer-events: none;
    }

    .kaaba-icon-wrapper {
      width: 36px;
      height: 36px;
      background: #25d366;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(37, 211, 102, 0.7);
      border: 2px solid #ffffff;
    }

    .kaaba-icon-wrapper svg {
      width: 20px;
      height: 20px;
    }

    /* Status Banner - Default (Belum Menghadap / Merah) */
    .status-banner {
      margin-top: 20px;
      padding: 12px 20px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      background: #fdeded;
      border: 1.5px solid #f44336;
      transition: all 0.3s ease;
    }

    .status-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f44336;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-right: 12px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .status-text {
      display: flex;
      flex-direction: column;
    }

    .status-title {
      font-size: 15px;
      font-weight: 700;
      color: #d32f2f;
      transition: color 0.3s ease;
    }

    .status-sub {
      font-size: 13px;
      color: #555;
      margin-top: 1px;
    }

    /* Status Banner - Pas / Menghadap Kiblat (Hijau) */
    .status-banner.ok {
      background: #e8f8f0;
      border-color: #2ecc71;
    }

    .status-banner.ok .status-icon {
      background: #2ecc71;
    }

    .status-banner.ok .status-title {
      color: #27ae60;
    }

    /* Info Table */
    .info-container {
      margin-top: 15px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      display: flex;
      align-items: center;
      font-size: 15px;
      color: #333;
    }

    .info-icon {
      width: 24px;
      height: 24px;
      margin-right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .info-value {
      font-size: 15px;
      font-weight: 700;
      color: #000;
    }

    /* Main Action Button */
    .btn-action {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      background: #0066ff;
      color: white;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 102, 255, 0.25);
    }

    .btn-action:active {
      background: #0052cc;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: 12px;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Pencari Kiblat</h1>

  <div class="compass-container">
    <div id="dial" class="dial">
      <!-- MATA ANGIN POKOK (SEMUA MENGGUNAKAN TAMPILAN VERTIKAL RAPI) -->
      <div class="cardinal north"><span class="cardinal-letter">U</span><span class="cardinal-deg">0<br>360</span></div>
      <div class="cardinal east"><span class="cardinal-letter">T</span><span class="cardinal-deg">90</span></div>
      <div class="cardinal south"><span class="cardinal-letter">S</span><span class="cardinal-deg">180</span></div>
      <div class="cardinal west"><span class="cardinal-letter">B</span><span class="cardinal-deg">270</span></div>
    </div>

    <!-- MARKER KABAH DENGAN GLOW HIJAU -->
    <div id="qiblaMarker" class="qibla-marker">
      <div class="kaaba-icon-wrapper">
        <svg viewBox="0 0 24 24" fill="white">
          <path d="M19 4H5C3.89 4 3 4.89 3 6V18C3 19.1 3.89 20 5 20H19C20.1 20 21 19.1 21 18V6C21 4.89 20.1 4 19 4ZM11 6H13V8H11V6ZM19 18H5V10H19V18Z"/>
        </svg>
      </div>
    </div>

    <!-- JARUM KOMPAS -->
    <div class="needle">
      <div class="needle-north"></div>
      <div class="needle-south"></div>
    </div>

    <!-- PIN TENGAH KOMPAS -->
    <div class="center-cap"></div>
  </div>

  <!-- STATUS BOX -->
  <div id="statusBanner" class="status-banner">
    <div id="statusIcon" class="status-icon">✕</div>
    <div class="status-text">
      <div id="statusTitle" class="status-title">Belum Menghadap Kiblat</div>
      <div id="statusSub" class="status-sub">Putar HP</div>
    </div>
  </div>

  <!-- INFO RINCIAN -->
  <div class="info-container">
    <div class="info-row">
      <div class="info-label">
        <div class="info-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#0066ff"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        </div>
        Latitude
      </div>
      <div id="lat" class="info-value">-7.289079</div>
    </div>

    <div class="info-row">
      <div class="info-label">
        <div class="info-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#0066ff"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        </div>
        Longitude
      </div>
      <div id="lng" class="info-value">112.736086</div>
    </div>

    <div class="info-row">
      <div class="info-label">
        <div class="info-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0066ff" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        </div>
        Heading
      </div>
      <div id="heading" class="info-value">293.24°</div>
    </div>

    <div class="info-row">
      <div class="info-label">
        <div class="info-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#111"><path d="M19 4H5C3.89 4 3 4.89 3 6V18C3 19.1 3.89 20 5 20H19C20.1 20 21 19.1 21 18V6C21 4.89 20.1 4 19 4ZM11 6H13V8H11V6ZM19 18H5V10H19V18Z"/></svg>
        </div>
        Arah Kiblat
      </div>
      <div id="bearing" class="info-value">293°</div>
    </div>
  </div>

  <button class="btn-action" onclick="initApp()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    Ambil Lokasi
  </button>

  <div class="footer-note">ⓘ Arahkan panah merah ke ikon Ka'bah</div>
</div>

<script>
  const kaabaLat = 21.422487;
  const kaabaLng = 39.826206;

  let qibla = 294.04;
  let targetHeading = 293.8;
  let smoothHeading = 293.8;
  let animationStarted = false;
  let firstHeading = true;
  let sensorStarted = false;

  // Render Sub-Garis (Ticks) dan Angka Derajat
  function createTicks() {
    const dial = document.getElementById("dial");

    for (let i = 0; i < 360; i += 5) {
      if (i === 0 || i === 90 || i === 180 || i === 270) continue;

      const tick = document.createElement("div");
      tick.className = "tick " + (i % 30 === 0 ? "tick-major" : "tick-minor");
      tick.style.transform = `translateX(-50%) rotate(${i}deg)`;
      dial.appendChild(tick);
    }

    const degreesToLabel = [30, 60, 120, 150, 210, 240, 300, 330];
    degreesToLabel.forEach((degVal) => {
      const label = document.createElement("div");
      label.className = "degree-label";
      label.innerText = degVal;
      label.dataset.rot = degVal;
      label.style.left = "50%";
      label.style.top = "50%";
      label.style.transform = `translate(-50%, -50%) rotate(${degVal}deg) translateY(-126px) rotate(${-degVal}deg)`;
      dial.appendChild(label);
    });
  }
  createTicks();

  const rad = (x) => (x * Math.PI) / 180;
  const deg = (x) => (x * 180) / Math.PI;

  function qiblaBearing(lat, lng) {
    let phi1 = rad(lat);
    let phi2 = rad(kaabaLat);
    let dlambda = rad(kaabaLng - lng);

    let y = Math.sin(dlambda);
    let x = Math.cos(phi1) * Math.tan(phi2) - Math.sin(phi1) * Math.cos(dlambda);

    return (deg(Math.atan2(y, x)) + 360) % 360;
  }

  function updateCompass() {
    document.getElementById("dial").style.transform = `rotate(${-smoothHeading}deg)`;

    document.querySelectorAll(".degree-label").forEach((label) => {
      const rot = Number(label.dataset.rot);
      label.style.transform = `translate(-50%, -50%) rotate(${rot}deg) translateY(-126px) rotate(${smoothHeading - rot}deg)`;
    });

    let angle = (qibla - smoothHeading + 360) % 360;
    const radius = 126;
    const x = Math.sin(rad(angle)) * radius;
    const y = -Math.cos(rad(angle)) * radius;

    const marker = document.getElementById("qiblaMarker");
    marker.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;

    checkQibla(angle);
  }

  function checkQibla(angle) {
    let diff = ((angle + 540) % 360) - 180;
    let absDiff = Math.abs(diff);

    const banner = document.getElementById("statusBanner");
    const icon = document.getElementById("statusIcon");
    const title = document.getElementById("statusTitle");
    const sub = document.getElementById("statusSub");

    if (absDiff <= 3) {
      banner.className = "status-banner ok";
      icon.innerText = "✓";
      title.innerText = "Sudah Menghadap Kiblat";
      sub.innerText = "Selisih " + absDiff.toFixed(2) + "°";
    } else {
      banner.className = "status-banner";
      icon.innerText = "✕";
      title.innerText = "Belum Menghadap Kiblat";
      sub.innerText = "Selisih " + absDiff.toFixed(2) + "°";
    }
  }

  function animateCompass() {
    let diff = ((targetHeading - smoothHeading + 540) % 360) - 180;
    smoothHeading += diff * 0.15;
    smoothHeading = ((smoothHeading % 360) + 360) % 360;

    updateCompass();
    requestAnimationFrame(animateCompass);
  }

  function orientationHandler(e) {
    let heading = null;
    if (typeof e.webkitCompassHeading === "number") {
      heading = e.webkitCompassHeading;
    } else if (e.alpha !== null) {
      heading = 360 - e.alpha;
    }

    if (heading !== null) {
      heading = ((heading % 360) + 360) % 360;

      if (firstHeading) {
        targetHeading = heading;
        smoothHeading = heading;
        firstHeading = false;
      }

      let diff = ((heading - targetHeading + 540) % 360) - 180;
      targetHeading += diff * 0.4;
      targetHeading = ((targetHeading % 360) + 360) % 360;

      document.getElementById("heading").innerText = targetHeading.toFixed(1) + "°";
    }
  }

  function getLocation() {
    if (!navigator.geolocation) return;

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        let lat = pos.coords.latitude;
        let lng = pos.coords.longitude;

        document.getElementById("lat").innerText = lat.toFixed(6);
        document.getElementById("lng").innerText = lng.toFixed(6);

        qibla = qiblaBearing(lat, lng);
        document.getElementById("bearing").innerText = qibla.toFixed(2) + "°";
      },
      (err) => {
        console.warn("Gagal lokasi: " + err.message);
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  function initApp() {
    getLocation();

    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {
      DeviceOrientationEvent.requestPermission()
        .then((permission) => {
          if (permission === "granted") startCompassListener();
        })
        .catch(console.error);
    } else {
      startCompassListener();
    }
  }

  function startCompassListener() {
    if (sensorStarted) return;

    if ("ondeviceorientationabsolute" in window) {
      window.addEventListener("deviceorientationabsolute", orientationHandler, true);
    } else if ("ondeviceorientation" in window) {
      window.addEventListener("deviceorientation", orientationHandler, true);
    }

    sensorStarted = true;

    if (!animationStarted) {
      animationStarted = true;
      animateCompass();
    }
  }

  // Tampilan Default Awal Saat Pertama Dimuat
  updateCompass();
</script>

</body>
</html>
