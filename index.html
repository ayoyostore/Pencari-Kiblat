<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompas Kiblat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="compass-container">
        <!-- Segitiga penunjuk atas (Utara / Arah HP) -->
        <div class="pointer-top"></div>

        <!-- Muka Kompas yang Berputar -->
        <div class="compass-face" id="compassFace">
            <div class="cardinal north">N</div>
            <div class="cardinal east">E</div>
            <div class="cardinal south">S</div>
            <div class="cardinal west">W</div>
            
            <!-- Jarum Indikator Kiblat -->
            <div class="qibla-needle" id="qiblaNeedle"></div>
            <div class="center-dot"></div>
        </div>

        <button id="startBtn" class="btn">Aktifkan Kompas</button>
        
        <div class="info-section">
            <span>NOT WORKING?</span>
            <span class="info-icon" onclick="alert('Pastikan izin lokasi dan sensor orientasi perangkat aktif. Gunakan browser Chrome/Safari pada smartphone.')">i</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
