<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Pencari Kiblat</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#eef3f8;
padding:20px;

}


.card{

width:100%;
max-width:430px;
background:white;
padding:20px;
border-radius:25px;
box-shadow:0 10px 30px #0002;

}


h1{

text-align:center;
color:#222;

}


.compass{

width:300px;
height:300px;
margin:20px auto;
border-radius:50%;
position:relative;
overflow:hidden;
background:#fafafa;
border:10px solid white;
box-shadow:0 0 25px #0003;

}



.dial{

position:absolute;
width:100%;
height:100%;
border-radius:50%;
}


.tick{

position:absolute;
left:50%;
top:0;
width:2px;
height:145px;
background:#999;
transform-origin:center bottom;

}



.label{

position:absolute;
font-size:13px;
font-weight:bold;

}



.north,
.east,
.south,
.west{

position:absolute;
font-size:25px;
font-weight:bold;
z-index:5;

}


.north{

top:12px;
left:50%;
transform:translateX(-50%);
color:red;

}


.east{

right:15px;
top:50%;
transform:translateY(-50%);

}


.south{

bottom:12px;
left:50%;
transform:translateX(-50%);

}


.west{

left:15px;
top:50%;
transform:translateY(-50%);

}


/* jarum */

.needle{

position:absolute;
left:50%;
top:50%;
z-index:20;

}


.red{

position:absolute;
width:12px;
height:120px;
left:-6px;
top:-120px;
background:#e53935;
clip-path:polygon(50% 0,100% 100%,0 100%);

}


.blue{

position:absolute;
width:12px;
height:120px;
left:-6px;
top:0;
background:#1565c0;
clip-path:polygon(0 0,100% 0,50% 100%);

}



.center{

position:absolute;
left:50%;
top:50%;
width:20px;
height:20px;
margin:-10px;
background:#333;
border-radius:50%;
z-index:30;

}



/* kaabah */

.qibla-marker{

position:absolute;
left:50%;
top:50%;
font-size:35px;
z-index:10;

}



/* status */


.status{

padding:15px;
border-radius:30px;
text-align:center;
font-weight:bold;
font-size:18px;
margin-top:15px;

background:#ffe0b2;
color:#e65100;

}


.status.ok{

background:#d8ffd9;
color:#008c27;
border:2px solid #00c853;

}



.info{

margin-top:20px;
font-size:17px;

}


.item{

display:flex;
justify-content:space-between;
margin:12px 0;

}


.value{

font-weight:bold;

}


button{

width:100%;
padding:15px;
margin-top:20px;
border:0;
border-radius:15px;
background:#1976d2;
color:white;
font-size:18px;

}


</style>
</head>

<body>


<div class="card">

<h1>Pencari Kiblat</h1>


<div class="compass">


<div id="dial" class="dial">

<div class="north">U</div>
<div class="east">T</div>
<div class="south">S</div>
<div class="west">B</div>


<div id="qiblaMarker"
class="qibla-marker">
🕋
</div>


</div>


<div class="needle">

<div class="red"></div>
<div class="blue"></div>

</div>


<div class="center"></div>


</div>


<div id="status" class="status">
Arahkan ke Kiblat
</div>

<div class="info">

<div class="item">
<span>Latitude</span>
<span id="lat" class="value">-</span>
</div>

<div class="item">
<span>Longitude</span>
<span id="lng" class="value">-</span>
</div>

<div class="item">
<span>Heading</span>
<span id="heading" class="value">0°</span>
</div>

<div class="item">
<span>Arah Kiblat</span>
<span id="bearing" class="value">-</span>
</div>

</div>


<button onclick="getLocation()">
Ambil Lokasi
</button>


</div>


<script>


const kaabaLat = 21.422487;
const kaabaLng = 39.826206;


let qibla = 0;

let targetHeading = 0;

let smoothHeading = 0;

let animationStarted=false;



// buat garis derajat otomatis

function createTicks(){

let dial=document.getElementById("dial");


for(let i=0;i<72;i++){

let tick=document.createElement("div");

tick.className="tick";


let angle=i*5;


tick.style.transform=
`translateX(-50%) rotate(${angle}deg)`;


dial.appendChild(tick);


}

}


createTicks();



// konversi sudut

function rad(x){

return x*Math.PI/180;

}


function deg(x){

return x*180/Math.PI;

}


// hitung arah kiblat

function qiblaBearing(lat,lng){


let phi1=rad(lat);

let phi2=rad(kaabaLat);

let dlambda=rad(kaabaLng-lng);



let y=Math.sin(dlambda);


let x=
Math.cos(phi1)*Math.tan(phi2)
-
Math.sin(phi1)*Math.cos(dlambda);



return (deg(Math.atan2(y,x))+360)%360;


}



// update kompas

function updateCompass(){



let dial=document.getElementById("dial");


// putar lingkaran

dial.style.transform=
`rotate(${-smoothHeading}deg)`;




// posisi ka'bah

let angle=qibla-smoothHeading;


let marker=
document.getElementById("qiblaMarker");



marker.style.transform=
`
translate(-50%,-50%)
rotate(${angle}deg)
translateY(-125px)
rotate(${-angle}deg)
`;



// huruf tetap tegak

document.querySelector(".north").style.transform=
`translateX(-50%) rotate(${smoothHeading}deg)`;


document.querySelector(".east").style.transform=
`translateY(-50%) rotate(${smoothHeading}deg)`;


document.querySelector(".south").style.transform=
`translateX(-50%) rotate(${smoothHeading}deg)`;


document.querySelector(".west").style.transform=
`translateY(-50%) rotate(${smoothHeading}deg)`;



checkQibla(angle);


}



// status kiblat

function checkQibla(angle){


let diff=((angle+540)%360)-180;


let status=document.getElementById("status");



if(Math.abs(diff)<=3){


status.className="status ok";

status.innerHTML=
"✅ Sudah Menghadap Kiblat";


}else{


status.className="status";

status.innerHTML=
"↻ Putar "
+
Math.abs(diff).toFixed(1)
+
"°";


}


}



// smoothing

function animateCompass(){


let diff=
((targetHeading-smoothHeading+540)%360)-180;



smoothHeading += diff*0.08;


smoothHeading=
(smoothHeading+360)%360;



updateCompass();



requestAnimationFrame(
animateCompass
);


}




// sensor kompas

function orientationHandler(e){


let heading=null;



if(typeof e.webkitCompassHeading==="number"){


heading=e.webkitCompassHeading;


}else if(e.alpha!==null){


heading=360-e.alpha;


}



if(heading!==null){


targetHeading=
(heading+360)%360;



document.getElementById("heading")
.innerHTML=
targetHeading.toFixed(1)+"°";


}


}





// lokasi berhasil

function success(pos){


let lat=
pos.coords.latitude;


let lng=
pos.coords.longitude;



document.getElementById("lat")
.innerHTML=
lat.toFixed(6);



document.getElementById("lng")
.innerHTML=
lng.toFixed(6);



qibla=qiblaBearing(lat,lng);



document.getElementById("bearing")
.innerHTML=
qibla.toFixed(2)+"°";



startCompass();


}



function error(){

alert(
"Lokasi tidak tersedia"
);

}




function getLocation(){


navigator.geolocation.getCurrentPosition(

success,

error,

{

enableHighAccuracy:true,

timeout:10000,

maximumAge:0

}

);


}





// mulai sensor

function startCompass(){



if(
typeof DeviceOrientationEvent!=="undefined"
&&
typeof DeviceOrientationEvent.requestPermission==="function"
){



DeviceOrientationEvent.requestPermission()

.then(result=>{


if(result==="granted"){


window.addEventListener(

"deviceorientation",

orientationHandler,

true

);


}


});



}else{



window.addEventListener(

"deviceorientationabsolute",

orientationHandler,

true

);



window.addEventListener(

"deviceorientation",

orientationHandler,

true

);



}



if(!animationStarted){


animationStarted=true;

animateCompass();


}



}



</script>


</body>
</html>
